<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berry Shop</title>
<style>
@font-face {
  font-family: 'Cafe24 Ssurround';
  font-weight: normal;
  font-style: normal;
  font-display: swap;
  src: url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Ssurround/Cafe24Ssurround.woff2') format('woff2'),
       url('https://cdn.jsdelivr.net/gh/fonts-archive/Cafe24Ssurround/Cafe24Ssurround.woff') format('woff');
}
</style>
<style>
  :root{
    --pink-deep:#e85d9c;
    --pink-soft:#ffd4e8;
    --pink-pale:#fff3f9;
    --ink:#3a2a33;
    --border:#e888b8;
    --shadow: rgba(201, 74, 134, 0.28);
    --shadow-soft: rgba(201, 74, 134, 0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background: linear-gradient(160deg, #ffe3f0 0%, #ffd4e8 35%, #fff3f9 75%, #ffffff 100%);
    background-attachment: fixed;
    font-family: "Cafe24 Ssurround", "Galmuri11", sans-serif;
    color:var(--ink);
    padding:20px;
  }

  .wrap{max-width:820px; margin:0 auto;}

  /* ---- 상단 배너 ---- */
  .banner{
    display:flex;
    gap:12px;
    margin:0 0 14px;
    align-items:flex-start;
  }
  .banner-img{
    flex:0 0 110px;
    width:110px;
    aspect-ratio:1/1;
    border-radius:14px;
    overflow:hidden;
    border:3px solid #ffffff;
    box-shadow:0 8px 18px var(--shadow);
    background:var(--pink-pale);
  }
  .banner-img img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .banner-img .banner-img-fallback{
    display:flex;
    width:100%; height:100%;
    align-items:center; justify-content:center;
    text-align:center;
    font-size:10px;
    color:#b98aa4;
    padding:0 6px;
  }
  .banner-box{
    flex:1;
    min-width:0;
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 8px 18px var(--shadow-soft);
    display:flex;
    flex-direction:column;
  }
  h1{
    text-align:center;
    font-size:16px;
    background:linear-gradient(135deg, #ffa9cf 0%, #ff85b8 100%);
    color:#fff;
    padding:10px 12px;
    margin:0;
  }
  .notice-box{
    padding:10px 14px;
    margin:0;
    text-align:center;
    border-top:1px solid rgba(201,74,134,0.12);
  }
  .notice-line1{
    font-size:12px;
    color:var(--ink);
    margin:0 0 4px;
  }
  .notice-line2{
    font-size:10px;
    color:var(--ink);
    opacity:0.55;
    margin:0;
  }
  .event-box{
    padding:8px 14px 10px;
    border-top:1px solid rgba(201,74,134,0.12);
  }
  .event-box-title{
    font-size:11px;
    color:var(--pink-deep);
    margin:0 0 6px;
  }
  .event-item{
    display:flex;
    gap:6px;
    align-items:flex-start;
    font-size:10.5px;
    line-height:1.5;
    margin:0 0 4px;
  }
  .event-item:last-child{margin-bottom:0;}
  .event-tag{
    flex:0 0 auto;
    font-size:9px;
    background:rgba(232,93,156,0.12);
    color:var(--pink-deep);
    border-radius:999px;
    padding:2px 8px;
    white-space:nowrap;
  }

  @media (max-width:480px){
    .banner{flex-direction:column;}
    .banner-img{width:100%; flex:0 0 auto;}
  }

  .controls{
    display:flex;
    gap:8px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .controls input, .controls select{
    font-family:inherit;
    font-size:12px;
    padding:9px 10px;
    border:2px solid var(--border);
    background:#fff;
    color:var(--ink);
  }
  .controls input{flex:2; min-width:160px;}
  .controls select{flex:1; min-width:120px;}

  .count{
    font-size:11px;
    color:#b3577f;
    margin-bottom:10px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(130px, 1fr));
    gap:12px;
  }
  .thumb-card{
    background:#fff;
    border:1px solid rgba(201,74,134,0.14);
    border-radius:12px;
    box-shadow:0 2px 10px rgba(201,74,134,0.10);
    cursor:pointer;
    overflow:hidden;
    position:relative;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .thumb-card:active{transform:translateY(1px); box-shadow:0 1px 4px rgba(201,74,134,0.10);}
  .thumb-img{
    aspect-ratio:1/1;
    background:var(--pink-pale);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .thumb-img img{width:100%;height:100%;object-fit:cover;}
  .thumb-img span{font-size:10px;color:#b98aa4; text-align:center; padding:0 6px;}
  .thumb-info{padding:9px 10px; font-size:10.5px; line-height:1.5;}
  .thumb-info .cat{color:#b3577f;}
  .thumb-info .status{
    display:inline-block;
    margin-top:3px;
    font-size:9px;
    background:rgba(232,93,156,0.10);
    color:var(--pink-deep);
    border-radius:999px;
    padding:2px 8px;
  }
  .thumb-info .status.done{background:rgba(0,0,0,0.06); color:#888;}

  /* ---- 하트(찜) ---- */
  .heart-btn{
    position:absolute; top:8px; right:8px; z-index:2;
    width:32px; height:32px; padding:0;
    border:none; border-radius:50%;
    background:rgba(255,255,255,0.88);
    box-shadow:0 2px 8px rgba(201,74,134,0.20);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .heart-btn svg, .btn-heart svg{
    width:18px; height:18px;
    fill:none; stroke:var(--pink-deep); stroke-width:2; stroke-linejoin:round;
  }
  .heart-btn.on svg, .btn-heart.on svg{fill:var(--pink-deep);}
  .heart-btn.pop svg{animation:heart-pop .25s ease;}
  @keyframes heart-pop{0%{transform:scale(.6);} 60%{transform:scale(1.25);} 100%{transform:scale(1);}}

  .wish-toggle{
    font-family:inherit; font-size:12px;
    padding:9px 12px;
    border:2px solid var(--border);
    background:#fff; color:var(--pink-deep);
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .wish-toggle svg{width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; stroke-linejoin:round;}
  .wish-toggle.on{background:var(--pink-deep); color:#fff; border-color:var(--pink-deep);}
  .wish-toggle.on svg{fill:currentColor;}
  .controls.wish-mode input, .controls.wish-mode select{opacity:.4; pointer-events:none;}

  .count-row{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .count-row .count{margin-bottom:0;}
  .wish-copy{
    font-family:inherit; font-size:11px;
    padding:6px 12px;
    border:none; border-radius:999px;
    background:var(--pink-deep); color:#fff;
    cursor:pointer;
  }
  .wish-copy[hidden]{display:none;}

  .empty{
    text-align:center;
    font-size:12px;
    color:#b98aa4;
    padding:40px 0;
  }

  /* ---- 상세보기 오버레이 ---- */
  .overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(58,42,51,.55);
    align-items:center; justify-content:center;
    padding:20px;
    z-index:10;
  }
  .overlay.open{display:flex;}
  .card{
    width:100%; max-width:380px;
    background:#fff;
    border:3px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 10px 24px var(--shadow);
  }
  .card-header{
    background:var(--pink-deep);
    border-bottom:3px solid var(--border);
    padding:10px 14px;
    font-size:13px;
    color:#fff;
  }
  .carousel{
    position:relative;
    aspect-ratio:1/1;
    background:var(--pink-pale);
    border-bottom:3px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .carousel img{width:100%;height:100%;object-fit:cover;display:none;}
  .carousel img.active{display:block;}
  .no-photo{font-size:12px;color:#b98aa4;}
  .arrow{
    position:absolute; top:50%; transform:translateY(-50%);
    background:#fff; border:2px solid var(--border);
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:14px;
    box-shadow:0 2px 8px var(--shadow-soft);
  }
  .arrow.prev{left:10px;} .arrow.next{right:10px;}
  .dots{position:absolute; bottom:8px; left:50%; transform:translateX(-50%); display:flex; gap:5px;}
  .dot{width:6px;height:6px;background:#fff;border:1.5px solid var(--border);}
  .dot.active{background:var(--pink-deep);}
  .info{
    padding:14px 16px;
    display:grid;
    grid-template-columns:auto 1fr;
    gap:9px 10px;
    font-size:12px;
    line-height:1.5;
  }
  .info dt{color:#b3577f; white-space:nowrap;}
  .info dd{margin:0; font-weight:bold;}
  .actions{display:flex; gap:8px; padding:0 16px 16px;}
  .actions a, .actions button{
    flex:1; text-align:center; font-family:inherit; font-size:12px;
    padding:10px 8px; border:2px solid var(--border); cursor:pointer; text-decoration:none;
  }
  .btn-kakao{background:#FEE500; color:var(--ink); box-shadow:0 3px 10px rgba(254,229,0,0.4);}
  .btn-kakao:active{transform:translateY(2px); box-shadow:none;}
  .btn-close{background:#fff; color:var(--ink); box-shadow:0 3px 10px rgba(0,0,0,0.12);}
  .btn-close:active{transform:translateY(2px); box-shadow:none;}
  .actions .btn-heart{
    flex:0 0 46px; padding:0;
    display:flex; align-items:center; justify-content:center;
    background:#fff; box-shadow:0 3px 10px rgba(0,0,0,0.12);
  }
  .actions .btn-heart:active{transform:translateY(2px); box-shadow:none;}
</style>
</head>
<body>

<div class="wrap">
  <div class="banner">
    <div class="banner-img">
      <img src="banner.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="banner-img-fallback" style="display:none;">banner.png<br>이미지를 넣어주세요</div>
    </div>
    <div class="banner-box">
      <h1>Berry Shop</h1>
      <div class="notice-box">
        <p class="notice-line1">전체 상태 필터를 &#39;판매중&#39;으로 변경 후 쇼핑해주세요</p>
        <p class="notice-line2">&#39;판매 미정&#39; 상품의 경우 부계정에 있는 등의 사유로 구매 불가한 아이템입니다. 추후 업로드 시 변동될 수 있습니다.</p>
      </div>
      <div class="event-box">
        <p class="event-box-title">📢 이번 주 이벤트</p>
        <div class="event-item"><span class="event-tag">이벤트</span><span>현재 진행중인 이벤트가 없어요</span></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="아이템 이름 검색...">
    <select id="categorySelect">
      <option value="">전체 카테고리</option>
    </select>
    <select id="statusSelect">
      <option value="">전체 상태</option>
      <option value="판매중">판매중</option>
      <option value="세트판매">세트판매</option>
      <option value="판매완료">판매완료</option>
      <option value="판매 미정">판매 미정</option>
    </select>
    <button type="button" class="wish-toggle" id="wishToggle" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      찜 목록 <span id="wishCount">0</span>
    </button>
  </div>

  <div class="count-row">
    <div class="count" id="count"></div>
    <button type="button" class="wish-copy" id="wishCopy" hidden>찜 목록 복사</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyMsg" style="display:none;">조건에 맞는 아이템이 없어요</div>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <div class="card-header">플레이빌</div>
    <div class="carousel" id="carousel">
      <div class="no-photo" id="noPhoto">사진 없음</div>
      <button class="arrow prev" id="prevBtn">◀</button>
      <button class="arrow next" id="nextBtn">▶</button>
      <div class="dots" id="dots"></div>
    </div>
    <dl class="info">
      <dt>이름</dt><dd id="fName">-</dd>
      <dt>카테고리</dt><dd id="fCategory">-</dd>
      <dt>상태</dt><dd id="fStatus">-</dd>
      <dt>가격</dt><dd id="fPrice">카카오톡 문의</dd>
    </dl>
    <div class="actions">
      <button type="button" class="btn-heart" id="popupHeart" aria-label="찜하기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </button>
      <a class="btn-kakao" id="kakaoBtn" href="https://open.kakao.com/o/s3Wg0Nch" target="_blank" rel="noopener">카카오톡 문의</a>
      <button class="btn-close" id="closeBtn">닫기</button>
    </div>
  </div>
</div>

<script>
  const KAKAO_URL = "https://open.kakao.com/o/sqk5d46g";

  const DATA_URL = "items.json?v=" + Date.now(); // 캐시 방지용
  let items = [];
  let filtered = [];

  // ---- 하트(찜) 상태: 이 기기(브라우저)에 저장돼요 ----
  const WISH_KEY = 'berryshop_wish_v1';
  const HEART_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
  let wished = new Set();
  try { wished = new Set(JSON.parse(localStorage.getItem(WISH_KEY) || '[]')); } catch (e) {}
  let wishOnly = false;
  let openedItem = null;

  const grid = document.getElementById('grid');
  const emptyMsg = document.getElementById('emptyMsg');
  const countEl = document.getElementById('count');
  const searchInput = document.getElementById('searchInput');
  const categorySelect = document.getElementById('categorySelect');
  const statusSelect = document.getElementById('statusSelect');
  const controlsEl = document.querySelector('.controls');
  const wishToggle = document.getElementById('wishToggle');
  const wishCountEl = document.getElementById('wishCount');
  const wishCopy = document.getElementById('wishCopy');
  const popupHeart = document.getElementById('popupHeart');

  fetch(DATA_URL)
    .then(r => r.json())
    .then(data => {
      items = data;
      const cats = [...new Set(items.map(i => i.category))].sort();
      cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        categorySelect.appendChild(opt);
      });
      applyFilters();
    })
    .catch(() => {
      grid.innerHTML = '';
      emptyMsg.textContent = 'items.json을 불러오지 못했어요. 같은 폴더에 items.json이 있는지 확인해주세요.';
      emptyMsg.style.display = 'block';
    });

  function applyFilters() {
    if (wishOnly) {
      // 찜 목록 보기에서는 검색/카테고리/상태 필터와 상관없이 하트 누른 아이템을 전부 보여줘요
      filtered = items.filter(i => wished.has(i.name));
      render();
      return;
    }
    const q = searchInput.value.trim().toLowerCase();
    const cat = categorySelect.value;
    const status = statusSelect.value;
    filtered = items.filter(i => {
      if (q && !i.name.toLowerCase().includes(q)) return false;
      if (cat && i.category !== cat) return false;
      if (status && !i.statuses.includes(status)) return false;
      return true;
    });
    render();
  }

  function render() {
    countEl.textContent = wishOnly ? `찜한 아이템 ${filtered.length}개` : `${filtered.length}개 아이템`;
    emptyMsg.textContent = wishOnly ? '아직 찜한 아이템이 없어요. 하트를 눌러 담아보세요' : '조건에 맞는 아이템이 없어요';
    grid.innerHTML = '';
    emptyMsg.style.display = filtered.length ? 'none' : 'block';
    filtered.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'thumb-card';
      const done = item.statuses.includes('판매완료');
      const badges = item.statuses.map(s => `<span class="status${s === '판매완료' ? ' done' : ''}">${s}</span>`).join(' ');
      card.innerHTML = `
        <div class="thumb-img">
          ${item.images[0] ? `<img src="${item.images[0]}" loading="lazy">` : `<span>사진 없음</span>`}
        </div>
        <div class="thumb-info">
          <div>${item.name}</div>
          <div class="cat">${item.category}</div>
          <div class="cat">${item.price ? item.price : '가격문의'}</div>
          ${badges}
        </div>`;
      const heart = document.createElement('button');
      heart.type = 'button';
      heart.className = 'heart-btn' + (wished.has(item.name) ? ' on' : '');
      heart.dataset.name = item.name;
      heart.setAttribute('aria-label', '찜하기');
      heart.innerHTML = HEART_SVG;
      heart.addEventListener('animationend', () => heart.classList.remove('pop'));
      heart.addEventListener('click', (e) => {
        e.stopPropagation(); // 하트를 눌러도 상세 팝업은 열리지 않게
        toggleWish(item.name);
        if (wished.has(item.name)) heart.classList.add('pop');
      });
      card.appendChild(heart);
      card.addEventListener('click', () => openItem(item));
      grid.appendChild(card);
    });
    syncHearts();
  }

  searchInput.addEventListener('input', applyFilters);
  categorySelect.addEventListener('change', applyFilters);
  statusSelect.addEventListener('change', applyFilters);

  // ---- 하트(찜) 동작 ----
  function saveWish() {
    try { localStorage.setItem(WISH_KEY, JSON.stringify([...wished])); } catch (e) {}
  }

  function toggleWish(name) {
    if (wished.has(name)) wished.delete(name); else wished.add(name);
    saveWish();
    if (wishOnly) applyFilters(); else syncHearts(); // 찜 목록 보기에서 하트를 끄면 바로 목록에서 빠져요
  }

  function syncHearts() {
    grid.querySelectorAll('.heart-btn').forEach(b => b.classList.toggle('on', wished.has(b.dataset.name)));
    popupHeart.classList.toggle('on', !!openedItem && wished.has(openedItem.name));
    // items.json에서 사라진 아이템이 세어지지 않도록 실제 아이템 기준으로 센다
    wishCountEl.textContent = items.length ? items.filter(i => wished.has(i.name)).length : wished.size;
  }

  wishToggle.addEventListener('click', () => {
    wishOnly = !wishOnly;
    wishToggle.classList.toggle('on', wishOnly);
    wishToggle.setAttribute('aria-pressed', String(wishOnly));
    controlsEl.classList.toggle('wish-mode', wishOnly);
    wishCopy.hidden = !wishOnly;
    applyFilters();
  });

  popupHeart.addEventListener('click', () => {
    if (openedItem) toggleWish(openedItem.name);
  });

  wishCopy.addEventListener('click', async () => {
    const names = filtered.map(i => i.name);
    if (!names.length) return;
    const text = '[Berry Shop 가격 문의]\n' + names.map(n => '- ' + n).join('\n');
    let ok = false;
    try {
      await navigator.clipboard.writeText(text);
      ok = true;
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { ok = document.execCommand('copy'); } catch (e2) {}
      ta.remove();
    }
    wishCopy.textContent = ok ? '복사됐어요' : '복사 실패';
    setTimeout(() => { wishCopy.textContent = '찜 목록 복사'; }, 1500);
  });

  // ---- 상세보기 ----
  const overlay = document.getElementById('overlay');
  const carousel = document.getElementById('carousel');
  const noPhoto = document.getElementById('noPhoto');
  const dotsWrap = document.getElementById('dots');
  let current = 0;

  function openItem(item) {
    document.getElementById('fName').textContent = item.name;
    document.getElementById('fCategory').textContent = item.category || '-';
    document.getElementById('fStatus').textContent = item.statuses && item.statuses.length ? item.statuses.join(', ') : '-';
    document.getElementById('fPrice').textContent = item.price ? item.price : '카카오톡 문의';
    document.getElementById('kakaoBtn').href = KAKAO_URL;
    openedItem = item;
    syncHearts();

    carousel.querySelectorAll('img').forEach(el => el.remove());
    dotsWrap.innerHTML = '';
    current = 0;

    if (item.images.length > 0) {
      noPhoto.style.display = 'none';
      item.images.forEach((src, i) => {
        const img = document.createElement('img');
        img.src = src;
        img.className = i === 0 ? 'active' : '';
        carousel.insertBefore(img, document.getElementById('prevBtn'));
        const dot = document.createElement('div');
        dot.className = 'dot' + (i === 0 ? ' active' : '');
        dotsWrap.appendChild(dot);
      });
    } else {
      noPhoto.style.display = 'block';
    }
    overlay.classList.add('open');
  }

  function show(index) {
    const imgs = carousel.querySelectorAll('img');
    const dots = dotsWrap.querySelectorAll('.dot');
    if (imgs.length === 0) return;
    imgs[current].classList.remove('active');
    dots[current].classList.remove('active');
    current = (index + imgs.length) % imgs.length;
    imgs[current].classList.add('active');
    dots[current].classList.add('active');
  }

  document.getElementById('prevBtn').addEventListener('click', () => show(current - 1));
  document.getElementById('nextBtn').addEventListener('click', () => show(current + 1));
  document.getElementById('closeBtn').addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });
</script>

</body>
</html>
